<header class="entete">
  <h1>Tableau de bord</h1>
  <p class="date">{{ aujourdhui | date: 'EEEE d MMMM y' }}</p>
</header>

<!-- Les chiffres du jour -->
<section class="chiffres" aria-label="Chiffres du jour">
  @for (ind of indicateurs; track ind.libelle) {
    <div class="chiffre">
      <span class="chiffre__icone"><mat-icon>{{ ind.icone }}</mat-icon></span>
      <div>
        <span class="chiffre__libelle">{{ ind.libelle }}</span>
        <span class="chiffre__valeur">{{ ind.valeur }}</span>
        <span class="chiffre__detail">{{ ind.detail }}</span>
      </div>
    </div>
  }
</section>

<app-renouvellements-card />
