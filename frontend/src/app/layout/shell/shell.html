<div class="shell">
  <!-- ===== Menu latéral ===== -->
  <aside class="menu" [class.menu--ouvert]="menuOuvert()">
    <div class="marque">
      <span class="marque__logo"><mat-icon>fitness_center</mat-icon></span>
      <span class="marque__nom">FitMaster</span>
    </div>

    <!-- Salle en cours (plus tard : choix parmi les salles de l'entreprise) -->
    <button class="salle" type="button">
      <span class="salle__textes">
        <span class="salle__entreprise">Gym Plus Abidjan</span>
        <span class="salle__nom">Salle de Cocody</span>
      </span>
      <mat-icon>unfold_more</mat-icon>
    </button>

    <nav class="navigation">
      @for (groupe of groupes; track groupe.titre) {
        <p class="navigation__titre">{{ groupe.titre }}</p>
        @for (lien of groupe.liens; track lien.path) {
          <a class="navigation__lien" [routerLink]="lien.path" routerLinkActive="navigation__lien--actif"
             (click)="menuOuvert.set(false)">
            <mat-icon>{{ lien.icon }}</mat-icon>
            <span>{{ lien.label }}</span>
          </a>
        }
      }
    </nav>

    <div class="utilisateur">
      <app-avatar nom="Aminata Konaté" [taille]="36" />
      <span class="utilisateur__textes">
        <span class="utilisateur__nom">Aminata Konaté</span>
        <span class="utilisateur__role">Gestionnaire</span>
      </span>
    </div>
  </aside>

  <!-- Voile sombre derrière le menu ouvert sur mobile -->
  @if (menuOuvert()) {
    <button type="button" class="voile" aria-label="Fermer le menu" (click)="menuOuvert.set(false)"></button>
  }

  <!-- ===== Zone de contenu ===== -->
  <div class="contenu">
    <header class="barre">
      <button mat-icon-button class="barre__menu" (click)="menuOuvert.set(true)" aria-label="Ouvrir le menu">
        <mat-icon>menu</mat-icon>
      </button>

      <label class="recherche">
        <mat-icon>search</mat-icon>
        <input type="search" placeholder="Rechercher un membre par nom ou téléphone" />
      </label>

      <button mat-flat-button class="barre__action bouton-degrade">
        <mat-icon>person_add</mat-icon>
        Inscrire un membre
      </button>
    </header>

    <main class="page">
      <router-outlet />
    </main>
  </div>
</div>
