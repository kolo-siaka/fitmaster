<mat-sidenav-container class="shell">
  <!-- Menu latéral -->
  <mat-sidenav mode="side" opened class="shell__nav">
    <div class="shell__brand">
      <mat-icon>fitness_center</mat-icon>
      <span>FitMaster</span>
    </div>

    <mat-nav-list>
      @for (item of navItems; track item.path) {
        <a mat-list-item [routerLink]="item.path"
           routerLinkActive #rla="routerLinkActive" [activated]="rla.isActive">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <!-- Contenu principal -->
  <mat-sidenav-content>
    <mat-toolbar class="shell__toolbar">Gestion de la salle de sport</mat-toolbar>
    <main class="shell__content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
